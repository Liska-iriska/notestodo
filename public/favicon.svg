<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4ADE80"/>
            <stop offset="100%" stop-color="#16A34A"/>
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect x="40" y="40" width="432" height="432" rx="64" fill="#FFFFFF"/>
    <!-- Notebook -->
    <rect
    x="110"
    y="90"
    width="250"
    height="320"
    rx="28"
    fill="#FFFFFF"
    stroke="#1E293B"
    stroke-width="18"/>
    <!-- Folded corner -->
    <path
    d="M310 410 L360 410 L360 360"
    fill="none"
    stroke="#1E293B"
    stroke-width="18"
    stroke-linejoin="round"/>
    <!-- Rings -->
    <line x1="150" y1="60" x2="150" y2="105" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
    <line x1="235" y1="60" x2="235" y2="105" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
    <line x1="320" y1="60" x2="320" y2="105" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
    <!-- Text lines -->
    <line x1="145" y1="165" x2="320" y2="165" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round"/>
    <line x1="145" y1="205" x2="295" y2="205" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round"/>
    <line x1="145" y1="245" x2="315" y2="245" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round"/>
    <!-- Check -->
    <path
    d="M175 300 L220 345 L325 235"
    fill="none"
    stroke="url(#check)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>